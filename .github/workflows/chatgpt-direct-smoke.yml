name: ChatGPT GitHub Bridge Smoke Test

on:
  push:
    branches:
      - experiment/chatgpt-direct-github-20261028

permissions:
  contents: read

jobs:
  static-smoke:
    name: Static game smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify JavaScript syntax
        run: node --check script.js
      - name: Confirm static game entry points
        run: test -s index.html && test -s style.css
